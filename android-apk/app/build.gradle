plugins {
    id 'com.android.application'
}

android {
    namespace 'com.akki.pwdfieldassistant'
    compileSdk 35

    defaultConfig {
        applicationId "com.akki.pwdfieldassistant"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1-test"
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.15.0'
}
