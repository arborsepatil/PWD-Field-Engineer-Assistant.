<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f8fc"><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="stylesheet" href="./app-shell.css"><title>JE Profile · PWD Tools</title><style>.profile-card h2{margin:0;font-size:23px}.profile-privacy{color:var(--muted);font-size:12px;line-height:1.5;margin:12px 2px}</style></head><body class="app-page"><main class="shell"><header class="topbar"><a class="brand" href="./index.html" style="text-decoration:none"><img src="./icon.svg" alt=""><div><div class="brand-title">PWD <span>Tools</span></div><div class="brand-sub">Field Engineering Assistant</div></div></a><div class="top-actions"><a href="./settings.html" class="icon-btn">⚙</a></div></header><div class="back-title"><a class="icon-btn" href="./index.html">‹</a><h1>JE Profile</h1></div><section class="profile-card"><div class="avatar" id="avatar">JE</div><div><h2 id="pName">Junior Engineer</h2><p id="pDesignation">Junior Engineer · Public Works Department</p><p id="pOffice">Office / Subdivision not set</p></div><div class="profile-actions"><button class="button ghost" id="editProfile">Edit</button></div></section><p class="profile-privacy">Profile information is stored on this device and is not an official PWD record.</p></main><nav class="bottom-nav"><a href="./index.html"><span>⌂</span>Home</a><a href="./library.html"><span>▤</span>Library</a><a href="./settings.html"><span>⚙</span>Settings</a></nav><script src="./app-shell.js"></script><script>const store=localStorage;function read(){try{return JSON.parse(store.getItem('pwd_profile')||'{}')}catch{return{}}}function draw(){const p=read(),name=p.name||'Junior Engineer',des=p.designation||'Junior Engineer',office=p.office||'Office / Subdivision not set';pName.textContent=name;pDesignation.textContent=des+' · Public Works Department';pOffice.textContent=office;avatar.textContent=(name.split(/\s+/).map(x=>x[0]).join('').slice(0,2)||'JE').toUpperCase();}editProfile.onclick=()=>{const p=read();const name=prompt('Display name',p.name||'')??p.name,designation=prompt('Designation',p.designation||'Junior Engineer')??p.designation,office=prompt('Office / Subdivision',p.office||'')??p.office;store.setItem('pwd_profile',JSON.stringify({name:name||'',designation:designation||'Junior Engineer',office:office||''}));draw()};draw();</script></body></html>
