name: Android installable APK

on:
  pull_request:
    paths:
      - 'android/**'
      - '*.html'
      - '*.js'
      - '*.css'
      - '*.svg'
      - '*.png'
      - '*.json'
      - '.github/workflows/android-apk.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '*.html'
      - '*.js'
      - '*.css'
      - '*.svg'
      - '*.png'
      - '*.json'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate GitHub runner Android SDK tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          echo "Detected Android SDK: $SDK_ROOT"
          test -d "$SDK_ROOT"
          MANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager -print -quit)"
          if [ -n "$MANAGER" ]; then
            echo "$(dirname "$MANAGER")" >> "$GITHUB_PATH"
            "$MANAGER" --version
          else
            echo "sdkmanager missing; only preinstalled Android platforms can be used"
          fi
      - name: Prepare compile tools from installed SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ ! -d "$SDK_ROOT/platforms/android-36" ] || [ ! -x "$SDK_ROOT/build-tools/36.0.0/apksigner" ]; then
            sdkmanager "platforms;android-36" "build-tools;36.0.0"
          fi
          test -d "$SDK_ROOT/platforms/android-36"
          test -x "$SDK_ROOT/build-tools/36.0.0/apksigner"
      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Run existing engineering release tests
        run: node tests/verify-release.mjs
      - name: Verify retaining wall construction-type navigation
        run: node tests/verify-wall-hub.mjs
      - name: Verify RCC 2023 exact source schedules
        run: node tests/verify-rcc-2023.mjs
      - name: Validate RCC project, dimensioned section and deferred BBS boundary
        run: node tests/verify-rcc-project.mjs
      - name: Verify source-linked Steel Table V1
        run: node tests/verify-steel-table.mjs
      - name: Check Steel Table compact UI and light/dark contrast
        run: node tests/verify-steel-ux.mjs
      - name: Validate Osdag source records and mass-area safety
        run: node tests/verify-steel-osdag.mjs
      - name: Verify SAIL 2023 range and full catalogue paging
        run: node tests/verify-steel-sail-range.mjs
      - name: Verify 2023 BIS CHS replacement-table sample and unlisted-size gate
        run: node tests/verify-steel-bis-chs.mjs
      - name: Verify BIS 4923 Amd 2 current wall minimum, Amd 3 RHS warnings and hollow diagrams
        run: node tests/verify-steel-bis-4923.mjs
      - name: Verify BIS 4923 corrected RHS nominal masses before APK release
        run: node tests/verify-steel-rhs-bis-audit.mjs
      - name: Audit amended BIS IS 4923 SHS and remaining RHS spot-checks
        run: node tests/verify-steel-bis-4923-v10.mjs
      - name: Audit 20 additional BIS 4923 SHS and RHS weights and source anomaly hold
        run: node tests/verify-steel-bis-4923-v11.mjs
      - name: Verify IS 4923 source numeric hold and real steel calculator status comparisons
        run: node tests/verify-steel-v12-calculator.mjs
      - name: Verify additional source-checked IS 4923 sections and current BIS certification scope
        run: node tests/verify-steel-bis-4923-v13.mjs
      - name: Verify Indian Standard 808 hot-rolled section weights and prevent archive conflicts
        run: node tests/verify-steel-is808-v14.mjs
      - name: Verify BIS 808 beam/channel geometry, radii, flange slope and negative data tests
        run: node tests/verify-steel-is808-v15-geometry.mjs
      - name: Check seven additional IS808 section family sample rows, with original BIS geometry
        run: node tests/verify-steel-is808-v16.mjs
      - name: Verify Android wrapper security and release scope
        run: node tests/verify-android.mjs
      - name: Bundle public engineering assets inside Android APK
        run: python3 android/scripts/prepare_assets.py
      - name: Check APK has no PWA installation workflow or private PDFs
        run: |
          test -f android/app/src/main/assets/www/pwd_retaining_walls.html
          test -f android/app/src/main/assets/www/pwd_pcc_wall_reference.html
          test -f android/app/src/main/assets/www/pwd_rcc_wall_reference.html
          test -f android/app/src/main/assets/www/rcc-wall-2023-data.js
          test -f android/app/src/main/assets/www/rcc-wall-2023-rebar.js
          test -f android/app/src/main/assets/www/rcc-wall-2023-section.js
          test ! -f android/app/src/main/assets/www/rcc-wall-2023-bbs.js
          test -f android/app/src/main/assets/www/rcc-wall-2023-app.js
          test -f android/app/src/main/assets/www/pwd_retaining_wall_section_quantity.html
          test -f android/app/src/main/assets/www/pwd-wall-diagrams.js
          test -f android/app/src/main/assets/www/pwd_mix_batch_assistant.html
          test -f android/app/src/main/assets/www/pwd_steel_table.html
          test -f android/app/src/main/assets/www/pwd-steel-catalog.js
          test -f android/app/src/main/assets/www/pwd-steel-osdag.js
          test -f android/app/src/main/assets/www/pwd-steel-osdag-license.html
          test -f android/app/src/main/assets/www/pwd-steel-core.js
          test -f android/app/src/main/assets/www/pwd-steel-app.js
          ! grep -q 'navigator.serviceWorker.register' android/app/src/main/assets/www/index.html
          ! find android/app/src/main/assets/www -iname '*.pdf' | grep -q .
      - name: Build INSTALLABLE Android debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Check APK signature and Android package ID
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging android/app/build/outputs/apk/debug/app-debug.apk | grep "package: name='in.pwdtools.fieldassistant'"
      - name: Publish installable APK for testing
        uses: actions/upload-artifact@v4
        with:
          name: PWD-Field-Assistant-Android-TEST-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
