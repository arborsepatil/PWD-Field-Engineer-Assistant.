name: Android installable APK

on:
  pull_request:
    paths:
      - 'android/**'
      - '*.html'
      - '*.js'
      - '*.css'
      - '*.svg'
      - '*.png'
      - '*.json'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/android-apk.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '*.html'
      - '*.js'
      - '*.css'
      - '*.svg'
      - '*.png'
      - '*.json'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate GitHub runner Android SDK tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          echo "Detected Android SDK: $SDK_ROOT"
          test -d "$SDK_ROOT"
          MANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager -print -quit)"
          if [ -n "$MANAGER" ]; then
            echo "$(dirname "$MANAGER")" >> "$GITHUB_PATH"
            "$MANAGER" --version
          else
            echo "sdkmanager missing; only preinstalled Android platforms can be used"
          fi
      - name: Prepare compile tools from installed SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ ! -d "$SDK_ROOT/platforms/android-36" ] || [ ! -x "$SDK_ROOT/build-tools/36.0.0/apksigner" ]; then
            sdkmanager "platforms;android-36" "build-tools;36.0.0"
          fi
          test -d "$SDK_ROOT/platforms/android-36"
          test -x "$SDK_ROOT/build-tools/36.0.0/apksigner"
      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Run existing engineering release tests
        run: node tests/verify-release.mjs
      - name: Verify retaining wall construction-type navigation
        run: node tests/verify-wall-hub.mjs
      - name: Verify RCC 2023 exact source schedules
        run: node tests/verify-rcc-2023.mjs
      - name: Validate RCC project, dimensioned section and deferred BBS boundary
        run: node tests/verify-rcc-project.mjs
      - name: Verify source-linked Steel Table V1
        run: node tests/verify-steel-table.mjs
      - name: Check Steel Table compact UI and light/dark contrast
        run: node tests/verify-steel-ux.mjs
      - name: Validate Osdag source records and mass-area safety
        run: node tests/verify-steel-osdag.mjs
      - name: Verify SAIL 2023 range and full catalogue paging
        run: node tests/verify-steel-sail-range.mjs
      - name: Verify 2023 BIS CHS replacement-table sample and unlisted-size gate
        run: node tests/verify-steel-bis-chs.mjs
      - name: Verify BIS 4923 Amd 2 current wall minimum, Amd 3 RHS warnings and hollow diagrams
        run: node tests/verify-steel-bis-4923.mjs
      - name: Verify BIS 4923 corrected RHS nominal masses before APK release
        run: node tests/verify-steel-rhs-bis-audit.mjs
      - name: Audit amended BIS IS 4923 SHS and remaining RHS spot-checks
        run: node tests/verify-steel-bis-4923-v10.mjs
      - name: Audit 20 additional BIS 4923 SHS and RHS weights and source anomaly hold
        run: node tests/verify-steel-bis-4923-v11.mjs
      - name: Verify IS 4923 source numeric hold and real steel calculator status comparisons
        run: node tests/verify-steel-v12-calculator.mjs
      - name: Verify additional source-checked IS 4923 sections and current BIS certification scope
        run: node tests/verify-steel-bis-4923-v13.mjs
      - name: Verify Indian Standard 808 hot-rolled section weights and prevent archive conflicts
        run: node tests/verify-steel-is808-v14.mjs
      - name: Verify BIS 808 beam/channel geometry, radii, flange slope and negative data tests
        run: node tests/verify-steel-is808-v15-geometry.mjs
      - name: Check seven additional IS808 section family sample rows, with original BIS geometry
        run: node tests/verify-steel-is808-v16.mjs
      - name: Audit IS 808 printed reference page mapping
        run: node tests/verify-steel-is808-v17-provenance.mjs
      - name: Check source-corrected IS 808 equal-angle masses against manufacturer conflicts
        run: node tests/verify-steel-is808-v18-angles.mjs
      - name: Verify steel quantity and CSV method source attribution
        run: node tests/verify-steel-v19-provenance.mjs
          node tests/verify-steel-v28-compare.mjs
          node tests/verify-steel-v29-bis-batch.mjs
          node tests/verify-steel-v29b-bis-batch.mjs
          node tests/verify-steel-v30-diagram.mjs
          node tests/verify-steel-v31-thickness.mjs
          node tests/verify-steel-v32-quantity-gate.mjs
          node tests/verify-steel-v33-audit-register.mjs
      - name: Verify restored Basic and Engineering Calculator
        run: node tests/verify-v37-calculator.mjs
      - name: Verify V40 Calculator and Civil user interactions
        run: node tests/verify-v40-calculator-ux.mjs
      - name: Verify V38 CivilBandhu branding and Home icon order
        run: node tests/verify-v38-civilbandhu-home.mjs
      - name: Verify V39 compact Home and safe bottom navigation
        run: node tests/verify-v39-home-navigation.mjs
      - name: Verify Steel V41 source-status views and quantity safety
        run: node tests/verify-steel-v41-source-status.mjs
      - name: Verify V42 IS 808:2021 selected Table 2 records
        run: node tests/verify-steel-v42-is808-table2.mjs
      - name: Verify Steel V43 IS 808 Table 6 and 7 channels
        run: node tests/verify-steel-v43-is808-channels.mjs
      - name: Verify Steel V44 IS 808 Table 8 parallel flange channels
        run: node tests/verify-steel-v44-is808-mpc.mjs
      - name: Verify Steel V45 IS 808 Table 1 remaining WB variants
        run: node tests/verify-steel-v45-is808-wb.mjs
      - name: Verify Steel V46 IS 808 Table 5 structural columns
        run: node tests/verify-steel-v46-is808-sc.mjs
      - name: Verify Steel V47 IS 808 Table 5 heavy-beam roll variants
        run: node tests/verify-steel-v47-is808-hb.mjs
      - name: Verify Steel V48 IS 808 Table 4 WPB roll variants
        run: node tests/verify-steel-v48-is808-wpb.mjs
      - name: Verify Steel V49 V50 V51 IS 808 Table 4 WPB source variants
        run: node tests/verify-steel-v49-is808-wpb.mjs
      - name: Verify Steel V50 IS 808 Table 4 WPB 260-340 variants
        run: node tests/verify-steel-v50-is808-wpb.mjs
      - name: Verify Steel V52 IS 808 Table 3 NPB source variants
        run: node tests/verify-steel-v52-is808-npb.mjs
      - name: Verify Steel V53 IS 808 Table 13 PBP
        run: node tests/verify-steel-v53-is808-pbp.mjs
      - name: Verify Steel V54 IS 808 Unequal Leg Angles Tables 11 and 12
        run: node tests/verify-steel-v54-is808-ue.mjs
      - name: Verify Steel V55 equal-leg angles, tamper holds and quantity gate
        run: node tests/verify-steel-v55-is808-eq.mjs
      - name: Verify Steel V57 circular-tube source masses and fail-closed checks
        run: node tests/verify-steel-v57-is1161-chs.mjs
      - name: Verify V58 historical CHS absence and purchaser agreement cautions
        run: node tests/verify-steel-v58-chs-unlisted.mjs
      - name: Verify Steel V59 selected BIS nominal masses and manufacturer conflicts
        run: node tests/verify-steel-v59-is808-curated.mjs
      - name: Audit exact remaining Steel Table source-review queue (V59)
        run: node scripts/steel-v59-pending-inventory.mjs
      - name: Report incomplete Steel Table families (no deployment)
        run: node scripts/steel-release-readiness.mjs --report-only
      - name: Verify V20 simplified Home and module screens
        run: node tests/verify-v20-simple-ux.mjs
      - name: Test simplified reference readers and preserve source checks
        run: node tests/verify-v21-reader-ux.mjs
      - name: Verify Batch Assistant contextual help on Material and AJAX tabs
        run: node tests/verify-v21-batch-guidance.mjs
      - name: Verify final V21 simplified navigation and JE Profile
        run: node tests/verify-v21-final-navigation.mjs
      - name: Verify simplified PDF/source-reader entry UI
        run: node tests/verify-v23-reference-entry-ux.mjs
      - name: Check tap-to-content navigation in three reference readers
        run: node tests/verify-v24-mobile-reader.mjs
      - name: Verify simplified source reader filters
        run: node tests/verify-v25-reader-filters.mjs
      - name: Verify public-only Library and source privacy
        run: |
          node tests/verify-v26-simple-library.mjs
          node tests/verify-v33-public-library.mjs
          node tests/verify-v34-public-privacy.mjs
          node tests/verify-v35-publisher-access.mjs
      - name: Verify offline digital SSR XLSX importer and source category search
        run: node tests/verify-v27-ssr-reader.mjs
      - name: Verify Android wrapper security and release scope
        run: node tests/verify-android.mjs
      - name: Bundle public engineering assets inside Android APK
        run: python3 android/scripts/prepare_assets.py
      - name: Check APK has no PWA installation workflow or private PDFs
        run: |
          test -f android/app/src/main/assets/www/pwd_retaining_walls.html
          test -f android/app/src/main/assets/www/pwd_pcc_wall_reference.html
          test -f android/app/src/main/assets/www/pwd_rcc_wall_reference.html
          test -f android/app/src/main/assets/www/rcc-wall-2023-data.js
          test -f android/app/src/main/assets/www/rcc-wall-2023-rebar.js
          test -f android/app/src/main/assets/www/rcc-wall-2023-section.js
          test ! -f android/app/src/main/assets/www/rcc-wall-2023-bbs.js
          test -f android/app/src/main/assets/www/rcc-wall-2023-app.js
          test -f android/app/src/main/assets/www/pwd_retaining_wall_section_quantity.html
          test -f android/app/src/main/assets/www/pwd-wall-diagrams.js
          test -f android/app/src/main/assets/www/pwd_mix_batch_assistant.html
          test -f android/app/src/main/assets/www/pwd_steel_table.html
          test -f android/app/src/main/assets/www/pwd-steel-catalog.js
          test -f android/app/src/main/assets/www/pwd-steel-osdag.js
          test -f android/app/src/main/assets/www/pwd-steel-osdag-license.html
          test -f android/app/src/main/assets/www/pwd-steel-core.js
          test -f android/app/src/main/assets/www/pwd-steel-diagram.js
          test -f android/app/src/main/assets/www/pwd-steel-app.js
          ! grep -q 'navigator.serviceWorker.register' android/app/src/main/assets/www/index.html
          ! find android/app/src/main/assets/www -iname '*.pdf' | grep -q .
          test ! -f android/app/src/main/assets/www/library-offline.js
          python3 scripts/prepare_public_site.py
      - name: Build INSTALLABLE Android debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Check APK signature and Android package ID
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging android/app/build/outputs/apk/debug/app-debug.apk | grep "package: name='in.pwdtools.fieldassistant'"
      - name: Publish installable APK for testing
        uses: actions/upload-artifact@v4
        with:
          name: PWD-Field-Assistant-Android-TEST-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
