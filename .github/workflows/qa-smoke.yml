name: PWD Field Assistant Release Smoke Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate offline assets and reader/QC modules
        run: |
          node tests/verify-release.mjs
          node tests/verify-wall-hub.mjs
          node tests/verify-rcc-2023.mjs
          node tests/verify-rcc-project.mjs
          node tests/verify-steel-table.mjs
          node tests/verify-steel-ux.mjs
          node tests/verify-steel-osdag.mjs
          node tests/verify-steel-sail-range.mjs
          node tests/verify-steel-bis-chs.mjs
          node tests/verify-steel-bis-4923.mjs
          node tests/verify-steel-rhs-bis-audit.mjs
          node tests/verify-steel-bis-4923-v10.mjs
          node tests/verify-steel-bis-4923-v11.mjs
          node tests/verify-steel-v12-calculator.mjs
          node tests/verify-steel-bis-4923-v13.mjs
          node tests/verify-steel-is808-v14.mjs
          node tests/verify-steel-is808-v15-geometry.mjs
          node tests/verify-steel-is808-v16.mjs
          node tests/verify-steel-is808-v17-provenance.mjs
          node tests/verify-steel-is808-v18-angles.mjs
