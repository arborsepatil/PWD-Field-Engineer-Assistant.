plugins {
    id 'com.android.application'
}
android {
    namespace 'in.pwdtools.fieldassistant'
    compileSdk 36
    defaultConfig {
        applicationId 'in.pwdtools.fieldassistant'
        minSdk 24
        targetSdk 36
        versionCode 6
        versionName '0.6.0-books-preview'
    }
    buildTypes {
        debug {
            applicationIdSuffix '.preview'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.17.1'
}
